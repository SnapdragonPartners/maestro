# Spike: SeaweedFS as the local object provider (SnapdragonPartners/maestro#350).
# Mirrors deploy/dataplane/compose.yaml's MinIO service shape: one bind-mounted
# data directory, arbitrary host uid, credentials by environment, loopback port.
name: maestro-spike-seaweedfs
services:
  seaweedfs:
    # dev, not 4.47: 4.47 omits <Initiated> from ListMultipartUploads, which the
    # sweep's grace period reads; fixed in master (seaweedfs#11313, 2026-09-14).
    image: chrislusf/seaweedfs:dev
    user: "${MAESTRO_UID}:${MAESTRO_GID}"
    command: >
      server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024 -volume.max=0
      -s3 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:${SPIKE_S3_PORT}:8333"
    volumes:
      - "${SPIKE_DATA_DIR}:/data"
