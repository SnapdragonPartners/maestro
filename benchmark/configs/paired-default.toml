# The paired-agent default configuration (ADR 0025: mandatory from the
# start): v1's factory path, driven black-box by the v1-as-patched adapter.
# Budget expectations calibrated by item 6's instrumented runs (2026-07-21).
# See docs/v2/phase_1/d9_budget_policy.md for the measurements and derivation.
schema_version = 2
name = "paired-default"
description = "v1-as-patched paired-agent factory default"

[model]
default = "claude-sonnet-4-6"

# ⚠️ DO NOT RUN A PAID SUITE ON THIS CONFIG UNTIL #317 IS FIXED. The architect
# seat is known-broken: gpt-4.1 never calls the terminal review_complete tool in
# the code-approval loop, so a story deadlocks into ESCALATED — which no headless
# run can answer — and then burns tokens in a coder requeue loop. It is flaky,
# not uniformly broken: on 2026-08-08 dep-bump-xnet was accepted while the
# trivial smoke-comment deadlocked.
#
# Pairing is cross-vendor by design: the architect that reviews the coder's work
# must not be the same model family that produced it (paired-local already does
# this). The seat moved off claude-opus-4-1 on 2026-08-08 when that model reached
# its scheduled retirement and started returning 404, which is what stopped the
# Phase 2 phase-exit run. gpt-4.1 is recorded here as the intended direction, to
# be made to work in Phase 3 rather than reverted to Anthropic-reviewing-Anthropic.
#
# Reasoning-tier models cannot fill this seat either until #316 is fixed: v1 sends
# a non-nil temperature on every call, and gpt-5, o4-mini and claude-opus-5 all
# reject it with a 400. Between #316 and #317 the viable set is currently empty.
#
# This changes config_hash (3d999b22fbbb -> cdc1490b5cc3), so runs from here are a
# new identity group and are not a comparable series with anything before them.
[model.roles]
coder = "claude-sonnet-4-6"
architect = "gpt-4.1"
pm = "claude-sonnet-4-6"

[prompt]
pack = "v1-embedded"

[harness]
adapter = "v1-as-patched"

[harness.settings]
# Paths are relative to the runner's working directory (benchmark/).
maestro_bin = "../bin/maestro"
source_dir = ".."
platform = "go"
test_cmd = "go test ./..."
poll_interval = "5s"
# Library fixtures carry no Dockerfile; pin a Go-capable coder container
# (discovery run 3: the bootstrap fallback has no Go toolchain). The union
# cache image (item 5.1, #268) is golang:1.26 with every golden Go fixture's
# module cache baked in, so runs skip the cold `go mod download` tax. It is a
# multi-arch manifest (linux/amd64 + linux/arm64) so arm64 dev and amd64 CI
# both pull their matching arch; pinned by the arch-independent immutable
# manifest digest so identical harness hashes execute identical contents.
# Republish + re-pin this digest when the image no longer COVERS the fixtures'
# current pins; a re-pin it still covers keeps this digest. make cache-verify is
# the gate (benchmark/cache/, make cache-publish). Amended 2026-07-22, proposed.
container_image = "ghcr.io/snapdragonpartners/golden-cache@sha256:dfc3f0d040229b75e5ad5982c26e5e988a9d5d9ca6441d61d3741defc0516b91"

# expected_cost_usd_per_run is the mean of the two accepted attempts on the
# latest-measured target identity ($4.58, rounded up); expected_tokens_per_run
# is the mean of the three attempts with surviving token records (491k) and so
# spans identities. Caps are the runaway safeguard, not a target. Full
# derivation and the per-attempt identities: docs/v2/phase_1/d9_budget_policy.md.
[budget]
expected_tokens_per_run = 500000
expected_cost_usd_per_run = 5.0
max_cost_usd_per_run = 24.0
max_cost_usd_per_suite = 70.0
